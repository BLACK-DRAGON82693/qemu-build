# Builds QEMU (aarch64 / Windows-on-ARM capable) for Android, and fetches the UEFI boot firmware.
# Put this file in your GitHub repository at:  .github/workflows/build-qemu.yml
# Then: Actions tab -> "Build QEMU for Android" -> Run workflow. When it finishes, download the "finite-qemu" artifact.
# NOT TESTED. If a step fails, open it, copy the last ~40 lines of red text, and send them to Claude.
name: Build QEMU for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      QEMU_VER: "9.2.0"
      GLIB_VER: "2.80.5"
      GLIB_SERIES: "2.80"
      PIXMAN_VER: "0.43.4"
      API: "28"
      # only look for libraries in our own Android folder, never the build machine's (x86) ones
      PKG_CONFIG_LIBDIR: "${{ github.workspace }}/deps/lib/pkgconfig:${{ github.workspace }}/deps/lib64/pkgconfig"
    steps:
      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip pkg-config flex bison bzip2 xz-utils curl libglib2.0-dev python3-venv git
          pip install --break-system-packages meson

      - name: Set up paths and compiler wrappers
        run: |
          set -eux
          TC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          P="$GITHUB_WORKSPACE/deps"; mkdir -p "$P" "$GITHUB_WORKSPACE/shim"
          echo "TC=$TC" >> $GITHUB_ENV; echo "PREFIX=$P" >> $GITHUB_ENV
          # QEMU's configure wants tools named <prefix>gcc, <prefix>ar ... so each one is a tiny script that calls the NDK's version
          pre="aarch64-linux-android${API}-"
          w() { printf '#!/bin/sh\nexec %s "$@"\n' "$2" > "$GITHUB_WORKSPACE/shim/${pre}$1"; chmod +x "$GITHUB_WORKSPACE/shim/${pre}$1"; }
          w gcc "$TC/aarch64-linux-android${API}-clang"; w cc "$TC/aarch64-linux-android${API}-clang"; w g++ "$TC/aarch64-linux-android${API}-clang++"
          w ar "$TC/llvm-ar"; w ranlib "$TC/llvm-ranlib"; w nm "$TC/llvm-nm"; w strip "$TC/llvm-strip"; w objcopy "$TC/llvm-objcopy"; w ld "$TC/ld.lld"
          w windres "true"
          cat > "$GITHUB_WORKSPACE/cross.txt" <<EOF
          [binaries]
          c = '$TC/aarch64-linux-android${API}-clang'
          cpp = '$TC/aarch64-linux-android${API}-clang++'
          ar = '$TC/llvm-ar'
          ranlib = '$TC/llvm-ranlib'
          strip = '$TC/llvm-strip'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          [built-in options]
          c_args = ['-fPIC']
          cpp_args = ['-fPIC']
          pkg_config_path = ['$P/lib/pkgconfig', '$P/lib64/pkgconfig']
          EOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/cross.txt"

      - name: Build glib (QEMU's main library)
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fLO "https://download.gnome.org/sources/glib/${GLIB_SERIES}/glib-${GLIB_VER}.tar.xz"
          tar xf "glib-${GLIB_VER}.tar.xz"; cd "glib-${GLIB_VER}"
          meson setup build --cross-file "$GITHUB_WORKSPACE/cross.txt" --prefix "$PREFIX" --libdir lib --default-library static \
            -Dtests=false -Dnls=disabled -Dlibmount=disabled -Dselinux=disabled -Dxattr=false -Dglib_debug=disabled \
            -Dintrospection=disabled -Dman-pages=disabled -Dsysprof=disabled -Dlibelf=disabled \
            --force-fallback-for=libffi,pcre2,proxy-libintl --wrap-mode=default
          ninja -C build install

      - name: Build pixman (draws the screen)
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fLO "https://cairographics.org/releases/pixman-${PIXMAN_VER}.tar.gz"
          tar xf "pixman-${PIXMAN_VER}.tar.gz"; cd "pixman-${PIXMAN_VER}"
          meson setup build --cross-file "$GITHUB_WORKSPACE/cross.txt" --prefix "$PREFIX" --libdir lib --default-library static \
            -Dtests=disabled -Ddemos=disabled -Dgtk=disabled -Dlibpng=disabled -Dopenmp=disabled
          ninja -C build install

      - name: Build QEMU
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fLO "https://download.qemu.org/qemu-${QEMU_VER}.tar.xz"
          tar xf "qemu-${QEMU_VER}.tar.xz"; cd "qemu-${QEMU_VER}"
          export PATH="$GITHUB_WORKSPACE/shim:$PATH"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/lib64/pkgconfig"
          mkdir build; cd build
          ../configure --cross-prefix="aarch64-linux-android${API}-" --target-list=aarch64-softmmu \
            --without-default-features --enable-tcg --enable-kvm --enable-slirp --enable-vnc --enable-tpm \
            --disable-docs --disable-tools --disable-guest-agent --disable-werror --disable-install-blobs \
            --extra-cflags="-I$PREFIX/include -fPIE" --extra-ldflags="-pie -L$PREFIX/lib -lpcre2-8 -lffi -lintl" 2>&1 | tee "$GITHUB_WORKSPACE/configure.log"
          ninja qemu-system-aarch64 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$TC/llvm-strip" -o "$GITHUB_WORKSPACE/out/libqemu.so" qemu-system-aarch64
          cp config.log "$GITHUB_WORKSPACE/config.log" || true

      - name: Boot firmware (UEFI for ARM, what lets Windows start)
        run: |
          set -eux
          cd "$RUNNER_TEMP/qemu-${QEMU_VER}"
          bunzip2 -kc pc-bios/edk2-aarch64-code.fd.bz2 > "$GITHUB_WORKSPACE/out/edk2-aarch64-code.fd"

      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-qemu
          if-no-files-found: warn
          path: |
            out/libqemu.so
            out/edk2-aarch64-code.fd
            configure.log
            build.log
            config.log

