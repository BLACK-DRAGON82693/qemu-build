name: Build Finite Functions with Windows (one app)

# Merges your Finite Functions project (FiniteFunctions.zip in this repo) into the official Winlator source (brunodev85/winlator-app),
# builds ONE app, and publishes the APK as a Release. A short report is written to the branch "ci-log" -> ci/last-build.txt after every run.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-finite-windows.yml'
      - 'FiniteFunctions.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Get this repository (it holds FiniteFunctions.zip)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Get the Winlator source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          submodules: recursive
          path: src

      - name: Unpack Finite Functions
        run: |
          test -f self/FiniteFunctions.zip || { echo "FiniteFunctions.zip is missing from the repository"; exit 1; }
          mkdir ff
          unzip -q self/FiniteFunctions.zip -d ff
          ls ff

      - name: Merge the two into one project
        run: |
          set -o pipefail
          cat > merge_ff.py <<'PYEOF'
          #!/usr/bin/env python3
          # Merges Finite Functions into the Winlator app source so the result is ONE app:
          #   - Finite Functions is the app you open (its launcher icon); Winlator's main screen is opened from FF's Tools tab.
          #   - Everything keeps working as one package (Winlator's own files expect the package name com.winlator, so that stays).
          import os, re, shutil, sys

          SRC, FF = sys.argv[1], sys.argv[2]            # SRC = winlator-app checkout, FF = unzipped Finite Functions project
          main, ffmain = f"{SRC}/app/src/main", f"{FF}/app/src/main"

          def rd(p):
              with open(p, encoding="utf-8") as f: return f.read()
          def wr(p, s):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f: f.write(s)
          def must(cond, msg):
              if not cond: sys.exit("MERGE ERROR: " + msg)

          # ---------- 1. Finite Functions' Kotlin code ----------
          shutil.copytree(f"{ffmain}/java/com/finite", f"{main}/java/com/finite", dirs_exist_ok=True)
          wr(f"{main}/java/com/finite/functions/FFFileProvider.kt", "package com.finite.functions\n\nclass FFFileProvider : androidx.core.content.FileProvider()\n")
          kdir = f"{main}/java/com/finite/functions"
          for name in sorted(os.listdir(kdir)):
              if not name.endswith(".kt"): continue
              p = f"{kdir}/{name}"; s = rd(p)
              s = s.replace("R.layout.widget", "R.layout.ff_widget")
              if re.search(r"(?<![\w.])R\.(style|layout|id|drawable|string|mipmap|xml|color)\b", s) and "import com.winlator.R" not in s:
                  must("package com.finite.functions\n" in s, name + " has no package line")
                  s = s.replace("package com.finite.functions\n", "package com.finite.functions\n\nimport com.winlator.R\n", 1)
              wr(p, s)

          # the Windows apps card in the Tools tab opens Winlator's main screen (same app)
          tp = f"{kdir}/Tools.kt"; t = rd(tp)
          anchor = '      item { ToolCard("audio"'
          must(anchor in t, "Tools.kt layout changed")
          card = ('      item(span = { GridItemSpan(2) }) { val ctx = androidx.compose.ui.platform.LocalContext.current; '
                  'MajorToolCard("grid", "Windows apps", "Run Windows programs and games") { '
                  'ctx.startActivity(android.content.Intent().setClassName(ctx.packageName, "com.winlator.MainActivity")) } }\n')
          t = t.replace(anchor, card + anchor, 1)
          wr(tp, t)

          # ---------- 2. Resources (renamed so they cannot clash with Winlator's) ----------
          tmp = f"{SRC}/_ffres"; shutil.rmtree(tmp, ignore_errors=True); shutil.copytree(f"{ffmain}/res", tmp)
          for old, new in (("layout/widget.xml", "layout/ff_widget.xml"), ("xml/file_paths.xml", "xml/ff_file_paths.xml"), ("values/v.xml", "values/ff_values.xml")):
              if os.path.exists(f"{tmp}/{old}"): os.rename(f"{tmp}/{old}", f"{tmp}/{new}")
          for root, _, files in os.walk(tmp):
              for fn in files:
                  if not fn.endswith(".xml"): continue
                  p = f"{root}/{fn}"; s = rd(p)
                  s = s.replace('name="app_name"', 'name="ff_app_name"').replace("@string/app_name", "@string/ff_app_name")
                  s = s.replace('name="ic_bg"', 'name="ff_ic_bg"').replace("@color/ic_bg", "@color/ff_ic_bg")
                  s = s.replace("@layout/widget", "@layout/ff_widget").replace("@xml/file_paths", "@xml/ff_file_paths")
                  wr(p, s)
          shutil.copytree(tmp, f"{main}/res", dirs_exist_ok=True); shutil.rmtree(tmp)

          # ---------- 3. One manifest ----------
          mp = f"{main}/AndroidManifest.xml"; m = rd(mp); ff = rd(f"{ffmain}/AndroidManifest.xml")

          # 3a. Winlator's own main screen is no longer a launcher icon (it is opened from inside Finite Functions)
          m, n = re.subn(r'\s*<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>', "", m, count=1)
          must(n == 1, "could not find Winlator's launcher entry")
          m, n = re.subn(r'(<activity android:name="com\.winlator\.MainActivity"[^>]*?)android:exported="true"', r'\1android:exported="false"', m, count=1, flags=re.S)
          must(n == 1, "could not find Winlator's MainActivity")

          # 3b. application tag: Finite Functions' application class, theme, icon and name
          m, n = re.subn(r"<application\b", '<application android:name="com.finite.functions.App" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/Theme.FF" android:allowBackup="true"', m, count=1)
          must(n == 1, "no <application> tag")
          m = re.sub(r'\s*android:appCategory="[^"]*"', "", m); m = re.sub(r'\s*android:isGame="[^"]*"', "", m)
          m = m.replace('android:label="@string/app_name"', 'android:label="@string/ff_app_name"', 1)

          # 3c. permissions Finite Functions needs that Winlator does not already declare
          have = set(re.findall(r'<uses-permission[^>]*android:name="([^"]+)"', m))
          extra = ""
          for tag in re.findall(r"<uses-permission[^>]*/>", ff):
              nm = re.search(r'android:name="([^"]+)"', tag).group(1)
              if nm not in have:
                  extra += "    " + re.sub(r'\s*android:maxSdkVersion="\d+"', "", tag) + "\n"; have.add(nm)
          m = m.replace("    <application", extra + "    <application", 1) if "    <application" in m else m.replace("<application", extra + "<application", 1)

          # 3d. Finite Functions' components (full class names, unique FileProvider class, renamed resources)
          inner = re.search(r"<application\b[^>]*>(.*)</application>", ff, re.S); must(inner, "FF manifest has no application block")
          inner = inner.group(1)
          inner = re.sub(r'android:name="\.(\w+)"', r'android:name="com.finite.functions.\1"', inner)
          inner = inner.replace("@string/app_name", "@string/ff_app_name").replace("@xml/file_paths", "@xml/ff_file_paths")
          inner = inner.replace('android:name="androidx.core.content.FileProvider"', 'android:name="com.finite.functions.FFFileProvider"')
          m = m.replace("</application>", "\n        <!-- ===== Finite Functions ===== -->\n" + inner + "\n    </application>", 1)
          wr(mp, m)

          # ---------- 4. Gradle ----------
          rg = f"{SRC}/build.gradle"; g = rd(rg)
          cp = "classpath 'com.android.tools.build:gradle:8.4.2'"
          must(cp in g, "Winlator's root build.gradle changed")
          g = g.replace(cp, cp + "\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'\n        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.20'", 1)
          wr(rg, g)

          ag = f"{SRC}/app/build.gradle"; a = rd(ag)
          must("apply plugin: 'com.android.application'" in a and "compileSdk 35" in a, "Winlator's app build.gradle changed")
          a = a.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'org.jetbrains.kotlin.android'\napply plugin: 'org.jetbrains.kotlin.plugin.compose'", 1)
          a = a.replace("    compileSdk 35\n", """    compileSdk 35
              buildFeatures { compose true }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              packagingOptions { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
          """, 1)
          a = a.replace("minifyEnabled true", "minifyEnabled false")   # the shrinker can break Compose and Winlator's native calls
          dep = "implementation 'androidx.lifecycle:lifecycle-process:2.5.1'"
          must(dep in a, "Winlator's dependency list changed")
          a = a.replace(dep, dep + """
              implementation platform('androidx.compose:compose-bom:2024.09.00')
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.activity:activity-compose:1.9.2'
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-session:1.4.1'
              implementation 'com.google.zxing:core:3.5.3'""", 1)
          a += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }
          """
          wr(ag, a)
          print("merge ok")
          PYEOF
          python3 merge_ff.py src ff/FiniteFunctions 2>&1 | tee merge.log

      - name: Package the merged project so you can open it in Android Studio
        run: |
          mkdir -p out
          cd src
          zip -qr ../out/finite-functions-android-studio-project.zip . -x '.git/*' '*/.git/*' '.gradle/*' 'build/*' 'app/build/*'
          ls -lh ../out

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pieces Winlator asks for
        run: |
          set -x
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - name: Build the app
        working-directory: src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect the APK
        run: |
          APK=$(find src/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          mkdir -p out
          cp "$APK" out/finite-functions.apk
          ls -l out

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finite-functions-apk
          path: out/finite-functions.apk

      - name: Keep the Android Studio project as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finite-functions-android-studio-project
          path: out/finite-functions-android-studio-project.zip

      - name: Publish the APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="finite-win-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/finite-functions.apk out/finite-functions-android-studio-project.zip --repo "$GITHUB_REPOSITORY" --title "Finite Functions + Windows $TAG" --notes "One app: Finite Functions with Winlator inside (Tools tab, Windows apps). Files: finite-functions.apk, and finite-functions-android-studio-project.zip (the merged project to open in Android Studio)."

      - name: Write a short report to the ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "status: $JOB_STATUS"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "=== merge step ==="
            head -30 merge.log 2>/dev/null
            echo
            echo "=== error lines in the build ==="
            grep -n -E "error:|^e: |FAILED|What went wrong|Execution failed|Could not|Duplicate|AAPT" build.log 2>/dev/null | head -50
            echo
            echo "=== last 80 lines of the build ==="
            tail -n 80 build.log 2>/dev/null
          } > report.txt
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/ci-log" -f sha="$GITHUB_SHA" > /dev/null 2>&1 || true
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/ci/last-build.txt?ref=ci-log" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/last-build.txt" -f message="build report" -f branch="ci-log" -f content="$(base64 -w0 report.txt)" -f sha="$OLD"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/last-build.txt" -f message="build report" -f branch="ci-log" -f content="$(base64 -w0 report.txt)"
          fi

